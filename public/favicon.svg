<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Minimal, Pure Vector SVG — 100% Transparent Background -->
  <!-- Modern Artisan Laundry Emblem in Theme Rust (#b2531a) -->
  
  <!-- Hanger Hook with organic flow -->
  <path d="M 32 8 C 36 8, 38.5 11, 38.5 14 C 38.5 18, 32 19, 32 23" 
        stroke="#b2531a" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Architectural Shoulder Line (Garment Frame) -->
  <path d="M 12 36 L 32 23 L 52 36" 
        stroke="#b2531a" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Lower Bar of Hanger -->
  <path d="M 16 36 L 48 36" 
        stroke="#b2531a" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Center Water Care Droplet suspended from the hanger -->
  <path d="M 32 27 C 32 27, 26 35, 26 38.5 C 26 41.8, 28.7 44.5, 32 44.5 C 35.3 44.5, 38 41.8, 38 38.5 C 38 35, 32 27, 32 27 Z" 
        fill="#b2531a" />

  <!-- Inner Water Ripple / Garment Pleat -->
  <path d="M 29.5 39 C 30.5 41, 33.5 41, 34.5 39" 
        stroke="#ffffff" 
        stroke-width="1.4" 
        stroke-linecap="round" />

  <!-- Delicate Fabric Steam Wave Curves (Gentle, authentic laundry care) -->
  <path d="M 23 51 C 24 47.5, 22 45, 23 42" 
        stroke="#b2531a" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.6" />
  <path d="M 32 54 C 33 50, 31 48, 32 45.5" 
        stroke="#b2531a" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.85" />
  <path d="M 41 51 C 42 47.5, 40 45, 41 42" 
        stroke="#b2531a" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.6" />
</svg>