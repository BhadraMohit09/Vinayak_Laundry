<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <!-- Warm Editorial Rust Gradient -->
    <linearGradient id="svlRustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2531a" />
      <stop offset="100%" stop-color="#8a3c0f" />
    </linearGradient>

    <!-- Deep Warm Ink Base -->
    <linearGradient id="svlInkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211d" />
      <stop offset="100%" stop-color="#141311" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas: Crisp & prominent in both Dark and Light browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#svlInkGrad)" stroke="#b2531a" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Inner Soft Accent Ring (Laundry Drum & Artisan Precision motif) -->
  <circle cx="32" cy="33" r="23" stroke="#b2531a" stroke-width="1.8" stroke-dasharray="3 2.5" fill="none" opacity="0.35" />

  <!-- Artisan Coat Hanger & Garment Form (Iconic SVL emblem) -->
  <g transform="translate(0, 1)">
    <!-- Hanger Hook (Gold / Rust) -->
    <path d="M 32 15 C 32 10.5, 37.5 10.5, 37.5 14.5 C 37.5 18, 32 19, 32 23.5" 
          fill="none" 
          stroke="url(#svlRustGrad)" 
          stroke-width="3" 
          stroke-linecap="round" />

    <!-- Hanger Shoulder Triangular Contour -->
    <path d="M 32 23.5 L 14 36.5 C 13.5 37, 14 38, 15 38 L 49 38 C 50 38, 50.5 37, 50 36.5 Z" 
          fill="none" 
          stroke="url(#svlRustGrad)" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Precision Lapel / Garment Collar Fold V-accent -->
    <path d="M 26 38 L 32 46 L 38 38" 
          fill="none" 
          stroke="#f6f3ed" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Fabric Sparkle / Eco Steam droplet star (Top Right) -->
  <path d="M 47 13 Q 48.5 17 52.5 18.5 Q 48.5 20 47 24 Q 45.5 20 41.5 18.5 Q 45.5 17 47 13 Z" 
        fill="#fbeee6" />

  <!-- Micro Pristine Bubble (Bottom Center) -->
  <circle cx="32" cy="52" r="2.2" fill="#b2531a" />
</svg>